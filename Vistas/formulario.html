<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>

<body>
    <!--Header: es la cabeza del body-->
    <header>
        <h1>Formulario</h1>
    </header>
    <!--formulario-->
<div>
    <form action="../index.html" method="post">

           <div>
           <!--Label=Me permite ingresar texto fijo-->
           <label for="">Ingrese el nombre</label>
           <!--input-> caja para ingresar texto-->
           <input type="text">
           </div>


           <div>
           <!--Label=Me permite ingresar texto fijo-->
           <label for="">Ingrese la edad</label>
           <!--input-> caja para ingresar texto-->

           </div>

           <div>
           <!--Label=Me permite ingresar texto fijo-->

           <!--input-> caja para ingresar texto-->

           </div>

           <div>
           <!--Label=Me permite ingresar texto fijo-->

           <!--input-> caja para ingresar texto-->
           <input type="text" id="direccion"
           </div>
        <!--Boton submit me permite enviar la petición o información-->
        <div>
            <input type="submit" value="Enviar">

        </div>
        </form>
    </div>
        <!--Regresar al inicio-->
           <div>
